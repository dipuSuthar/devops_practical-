name: Setup AWS and Terraform
description: Assume the AWS role via OIDC, install Terraform, run terraform init for one environment

inputs:
  role-arn:
    required: true
    description: IAM role to assume
  region:
    required: true
    description: AWS region
  state-bucket:
    required: true
    description: S3 bucket for Terraform state
  environment:
    required: true
    description: Environment folder under terraform/envs (dev or prod)

runs:
  using: composite
  steps:
    - name: Debug OIDC claims
      shell: bash
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: |
        set -euo pipefail

        TOKEN=$(curl -fsS \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

        export TOKEN
        python3 - <<'PY'
        import os, json, base64
        token = os.environ["TOKEN"]
        payload = token.split(".")[1]
        payload += "=" * (-len(payload) % 4)
        claims = json.loads(base64.urlsafe_b64decode(payload))
        for key in ("iss", "aud", "sub"):
            print(f"{key} = {claims.get(key)}")
        PY

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        audience: sts.amazonaws.com
        role-session-name: GitHubActions-${{ github.run_id }}

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.5
        terraform_wrapper: false

    - name: Terraform init
      shell: bash
      working-directory: terraform/envs/${{ inputs.environment }}
      run: |
        terraform init -input=false \
          -backend-config="bucket=${{ inputs.state-bucket }}" \
          -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
          -backend-config="region=${{ inputs.region }}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"

